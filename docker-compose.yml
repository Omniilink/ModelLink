# Omniilink full-stack deployment (see DOCKER.md for the step-by-step guide).
#
#   No Cloudflare dashboard needed: the tunnel reuses YOUR existing named
#   tunnel credentials from the normal run-server.py setup
#   (%USERPROFILE%\.cloudflared, tunnel-config.docker.yml).
#   Just run:  docker compose up -d --build
#
# Data lives on the host (same files the native run uses):
#   ./user_data, ./omnilink.db, ./network_usage.json, ./tunnel.log
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: omniilink:latest
    restart: unless-stopped
    ports:
      # Local access for testing; the public URL comes via the tunnel.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./user_data:/app/user_data
      - ./omnilink.db:/app/omnilink.db
      - ./network_usage.json:/app/network_usage.json
      - ./tunnel.log:/app/tunnel.log
      - ./modellink/server.log:/app/modellink/server.log
      # Server provider keys + settings (read-write so in-app key saves
      # persist back to the host file). Create an empty file if missing
      # BEFORE first up, or Docker makes a directory here instead:
      #   New-Item .env -ItemType File
      - ./.env:/app/.env
      # Docker socket: lets the API spawn per-command SANDBOX containers
      # (siblings, not children). Anyone with socket access == host root,
      # so this file must stay on YOUR machine. Never expose 2375 remotely.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Per-command code execution sandbox. Modes:
      #   ""        -> run commands on the host (old behavior)
      #   "docker"  -> every command in a FRESH ephemeral container
      #   "project" -> one PERSISTENT container per project, so installs
      #                (pip/npm/pyenv/...) survive between commands.
      #                Only that project folder is ever mounted.
      # Set to "" to fall back to host execution.
      - OMNIILINK_SANDBOX=project
      - OMNIILINK_SANDBOX_IMAGE=omniilink-sandbox:latest
      # The API runs IN a container, but docker run -v sources are resolved
      # on the Docker daemon's filesystem (the Windows host), not ours. This
      # maps the API container's /app to the host folder that backs it, so
      # sandboxes mount the REAL project files instead of an empty dir.
      # Matches update.bat's C:\\Modellink - change it if you move the app.
      - OMNIILINK_SANDBOX_HOST_ROOT=C:/Modellink
      # Only these usernames can open /admin (comma separated). They are also
      # promoted to is_admin=1 on every boot. "isaac tribbe" also covers an
      # "isaac_tribbe" account, since signup forbids spaces.
      - OMNIILINK_ADMIN_USERS=isaac tribbe
      # GitHub token so the panel updater can pull a PRIVATE repo. Empty is
      # fine: the api also re-reads it from the mounted .env, so adding
      # OMNIILINK_GIT_TOKEN there needs no container restart.
      - OMNIILINK_GIT_TOKEN=${OMNIILINK_GIT_TOKEN:-}
      # Sandbox network: "bridge" lets pip/npm install work; use "none" for
      # maximum isolation (offline code only).
      - OMNIILINK_SANDBOX_NET=bridge
      - OMNIILINK_SANDBOX_MEM=512m
      - OMNIILINK_SANDBOX_CPUS=1.0
      # Stop project containers after N idle minutes (keeps their installed
      # layers; they revive on next use). 0 = keep running forever.
      - OMNIILINK_PROJ_IDLE_MIN=0
    networks:
      - omniilink-net

  # Builds/pins the sandbox image so it always exists before first use.
  sandbox-image:
    build:
      context: .
      dockerfile: sandbox.Dockerfile
    image: omniilink-sandbox:latest

  # Self-update helper (git + compose + preflight script). Built so the
  # admin panel can update the host checkout through the docker socket;
  # the panel refuses to self-update until this image exists.
  updater-image:
    build:
      context: .
      dockerfile: updater.Dockerfile
    image: omniilink-updater:latest

  tunnel:
    # Named tunnel using YOUR existing credentials file — no Cloudflare
    # dashboard token, no card. Needs:
    #   tunnel-config.docker.yml (in repo) and
    #   ${USERPROFILE}/.cloudflared/<tunnel-id>.json (on YOUR machine only,
    #   created by the normal first-time run-server.py setup, never committed).
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run omniilink
    volumes:
      - ./tunnel-config.docker.yml:/etc/cloudflared/config.yml:ro
      - ${USERPROFILE}/.cloudflared:/etc/cloudflared-creds:ro
    depends_on:
      - api
    networks:
      - omniilink-net

networks:
  omniilink-net: {}
