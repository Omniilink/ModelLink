# Reverse proxy in front of the cobalt converter (More → YouTube downloads).
#
# Why this exists: cobalt serves /tunnel at its own root and has no subpath
# support, while our public address needs it under /converter/* on the main
# hostname (the tunnel's own *.cfargotunnel.com name has no IPv4 record, so
# phones and IPv4-only networks cannot reach it at all). nginx strips the
# prefix and streams everything through untouched.
#
# Timeouts and buffering are tuned for multi-hundred-MB downloads: nothing
# is spooled to disk and long streams are never cut.

server {
    listen 80;

    location /converter/ {
        rewrite ^/converter/(.*) /$1 break;
        proxy_pass http://cobalt:9000;
        proxy_http_version 1.1;

        # Stream, don't spool: files pass straight through to the browser.
        proxy_request_buffering off;
        proxy_buffering off;

        # A 45-minute video download is a single long stream.
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        send_timeout 3600s;
        client_max_body_size 0;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
