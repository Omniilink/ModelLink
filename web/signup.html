<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Get started — Omniilink</title>
<meta name="description" content="Create your Omniilink account." />
<meta name="theme-color" content="#0a0a0c" />
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" href="/favicon.svg?v=5" type="image/svg+xml" />
<link rel="alternate icon" href="/favicon.ico?v=5" />
<style>
  :root{--bg:#0a0a0c;--panel:#121214;--line:#232327;--text:#f5f5f4;--muted:#a3a3ab;--err:#f87171;--accent:#2563eb}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;-webkit-font-smoothing:antialiased}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:36px 32px;width:100%;max-width:380px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:22px;text-decoration:none;color:var(--text)}
  h1{font-size:22px;letter-spacing:-.02em;margin-bottom:6px}
  .sub{font-size:13.5px;color:var(--muted);margin-bottom:22px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  input{width:100%;background:#0a0a0c;border:1px solid var(--line);border-radius:9px;padding:11px 13px;color:var(--text);font-size:14px;margin-bottom:14px;outline:none;font-family:inherit}
  input:focus{border-color:var(--accent)}
  .btn{display:block;width:100%;text-align:center;text-decoration:none;font-size:14px;font-weight:600;padding:12px;border-radius:9px;border:1px solid var(--line);color:var(--text);background:#141416;cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s}
  .btn:hover{border-color:#3f3f46;background:#1a1a1e}
  .btn.primary{background:#EDEDEF;border-color:#EDEDEF;color:#0a0a0c;margin-bottom:10px}
  .btn.primary:hover{background:#fff;border-color:#fff}
  .btn.google{background:#fff;border-color:#fff;color:#1f1f22;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
  .btn.google:hover{background:#f4f4f5}
  .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
  .or::before,.or::after{content:'';flex:1;border-top:1px solid var(--line)}
  #err{display:none;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:var(--err);font-size:13px;border-radius:9px;padding:10px 13px;margin-bottom:14px}
  #gNote{display:none;font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:10px}
  .swap{margin-top:18px;text-align:center;font-size:13px;color:var(--muted)}
  .swap a{color:var(--text);font-weight:600}
</style>
</head>
<body>
<main class="card">
  <a class="brand" href="/"><img src="/favicon.svg?v=5" height="26" alt="Omniilink" />Omniilink</a>
  <h1>Create your account</h1>
  <p class="sub">Free while in beta. Bring one provider key and you're in.</p>
  <div id="err" role="alert"></div>
  <a class="btn google" id="googleBtn" href="/api/auth/google/start">
    <svg width="17" height="17" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.5h6.5c-.1 1.1-.8 2.7-2.4 3.8l-.1.1 3.5 2.7.2.1c2.2-2 3.8-5 3.8-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 7.9-2.9l-3.8-2.9c-1 .7-2.4 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5l-.1.1-3.7 2.9v.1C3.3 21.3 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.4c-.2-.7-.4-1.5-.4-2.4s.1-1.7.4-2.4l-.1-.1-3.6-2.8-.1.1C.5 8.7 0 10.2 0 12s.5 3.3 1.4 4.7l3.8-2.3z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.3 0 3.3 2.7 1.4 6.7l3.8 2.9c.9-2.9 3.6-4.9 6.8-4.9z"/></svg>
    Sign up with Google
  </a>
  <p id="gNote">Google sign-in isn't set up on this server — continue with a password below.</p>
  <div class="or">or with a password</div>
  <form id="f" autocomplete="on">
    <label for="u">Username</label>
    <input id="u" name="username" type="text" autocomplete="username" placeholder="3+ characters" />
    <label for="n">Display name (optional)</label>
    <input id="n" name="name" type="text" autocomplete="nickname" />
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="new-password" placeholder="6+ characters" />
    <button class="btn primary" type="submit">Create account</button>
  </form>
  <p class="swap">Have an account? <a href="/signin">Sign in</a></p>
</main>
<script>
(function(){
  function showError(t){
    var el = document.getElementById('err');
    el.textContent = t; el.style.display = 'block';
  }
  fetch('/api/auth/me', { credentials: 'same-origin' }).then(function(r){
    if (r.ok) location.replace('/chat');
  }).catch(function(){});
  try{
    var q = new URLSearchParams(location.search || '');
    if (q.get('error')) showError(q.get('error'));
  }catch(e){}
  fetch('/api/auth/oauth-status').then(function(r){ return r.json(); }).then(function(d){
    if (!d || !d.google) {
      var b = document.getElementById('googleBtn');
      if (b) b.style.display = 'none';
      var n = document.getElementById('gNote');
      if (n) n.style.display = 'block';
    } else if (d.google_only) {
      var f = document.getElementById('f'); if (f) f.style.display = 'none';
      var or = document.querySelector('.or'); if (or) or.style.display = 'none';
      var swap = document.querySelector('.swap'); if (swap) swap.style.display = 'none';
      var h1 = document.querySelector('h1'); if (h1) h1.textContent = 'Sign up with Google';
      var sub = document.querySelector('.sub'); if (sub) sub.textContent = 'Create your account with Google.';
    }
  }).catch(function(){});
  document.getElementById('f').addEventListener('submit', function(e){
    e.preventDefault();
    var u = document.getElementById('u').value.trim();
    var n = document.getElementById('n').value.trim();
    var p = document.getElementById('p').value;
    if (!u || u.length < 3) { showError('Username must be 3+ characters'); return; }
    if (!p || p.length < 6) { showError('Password must be 6+ characters'); return; }
    fetch('/api/auth/signup', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin', body: JSON.stringify({ username: u, password: p, name: n }) })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(x){
        if (x.ok && x.d.status === 'ok') location.href = '/chat';
        else showError((x.d && x.d.error) || 'Signup failed');
      })
      .catch(function(){ showError('Connection error'); });
  });
})();
</script>
</body>
</html>
