<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>Menu — Omniilink</title>
<link rel="icon" href="/favicon.svg?v=5">
<style>
:root{
  --bg:#0e0f12;--bg2:#14161a;--bg3:#1b1e24;--border:#24282f;--border2:#343a44;
  --tx:#e8eaed;--tx2:#9aa1ab;--tx3:#646c78;--accent:#2f6fed;--accent-l:#5b8def;
  --radius:12px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme=light]{
  --bg:#f2f3f5;--bg2:#ffffff;--bg3:#eceef1;--border:#dde0e5;--border2:#c3c8d0;
  --tx:#16181d;--tx2:#4d545e;--tx3:#8a919b;--accent:#245fd1;--accent-l:#2f6fed;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.head{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;flex-shrink:0}
.head img{border-radius:9px}
.brand{flex:1;min-width:0}
.brand b{font-size:17px;font-weight:700;letter-spacing:-.3px;display:block}
.brand span{font-size:12px;color:var(--tx3)}
.close{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--tx2);font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;text-decoration:none}
.scroll{flex:1;overflow-y:auto;padding:0 14px calc(24px + env(safe-area-inset-bottom))}
.newchat{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:16px;margin:4px 0 14px;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:15px;font-weight:650;text-decoration:none;border:none}
.newchat svg{width:20px;height:20px}
.cap{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--tx3);padding:16px 8px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;align-items:center;gap:12px;padding:16px 14px;border-radius:var(--radius);background:var(--bg2);border:1px solid var(--border);color:var(--tx);text-decoration:none;font-size:14px;font-weight:600;min-height:60px}
.tile:active{background:var(--bg3)}
.tile svg{width:22px;height:22px;flex-shrink:0;color:var(--accent-l)}
.tile .tag{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--accent-l);border:1px solid var(--accent);border-radius:5px;padding:1px 5px}
.tile.wide{grid-column:1 / -1}
.foot{display:flex;align-items:center;gap:10px;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);color:var(--tx3);font-size:11px;flex-shrink:0}
.foot .sp{flex:1}
.tbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg2);color:var(--tx2);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tbtn svg{width:17px;height:17px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr 1fr}}
</style>
</head>
<body>
<div class="head">
  <img src="/favicon.svg?v=5" height="34" alt="Omniilink">
  <div class="brand"><b>Omniilink</b><span id="who">Menu</span></div>
  <a class="close" href="/chat" aria-label="Close menu">&times;</a>
</div>
<div class="scroll">
  <a class="newchat" href="/chat?new=1">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    New chat
  </a>
  <div class="cap">Workspace</div>
  <div class="grid">
    <a class="tile" href="/chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>Chat</a>
    <a class="tile" href="/code"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>Coding<span class="tag">Beta</span></a>
    <a class="tile" href="/projects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>Projects<span class="tag">Beta</span></a>
  </div>
  <div class="cap">Tools</div>
  <div class="grid">
    <a class="tile" href="/more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Media &amp; convert</a>
    <a class="tile" href="/prompts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>Prompts</a>
    <a class="tile" href="/terminal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>Terminal</a>
    <a class="tile" href="/usage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 20V10"/><path d="M12 20V4"/><path d="M6 20v-6"/></svg>Usage</a>
  </div>
  <div class="cap">Manage</div>
  <div class="grid">
    <a class="tile" href="/agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>Agents</a>
    <a class="tile" href="/assets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Assets</a>
    <a class="tile" href="/public"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.9 5.7 3.9 9S14.5 18.4 12 21c-2.5-2.6-3.9-5.7-3.9-9S9.5 5.6 12 3z"/></svg>Public</a>
    <a class="tile" href="/forums"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>Forums</a>
    <a class="tile" href="/providers"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="15" r="4"/><path d="M10.9 12.1L21 2"/><path d="M15 8l3 3"/></svg>Providers</a>
    <a class="tile" href="/keys"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 7h3a5 5 0 015 5 5 5 0 01-5 5h-3m-6 0H6a5 5 0 01-5-5 5 5 0 015-5h3"/><line x1="8" y1="12" x2="16" y2="12"/></svg>API keys</a>
    <a class="tile" href="/settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>Settings</a>
    <a class="tile" href="/tutorial"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>Help</a>
    <a class="tile" id="admin-tile" href="/console" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Admin</a>
  </div>
</div>
<div class="foot">
  <span id="build">Omniilink</span>
  <span class="sp"></span>
  <button class="tbtn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme">
    <svg id="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    <svg id="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>
</div>
<script>
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);var m=document.getElementById('moon'),s=document.getElementById('sun');if(m)m.style.display=t==='dark'?'':'none';if(s)s.style.display=t==='light'?'':'none';try{localStorage.setItem('omnilink_theme',t)}catch(e){}}
applyTheme((function(){try{return localStorage.getItem('omnilink_theme')||'dark'}catch(e){return'dark'}})());
document.getElementById('theme-btn').addEventListener('click',function(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')});
fetch('/api/auth/me',{credentials:'same-origin'}).then(function(r){return r.ok?r.json():null}).then(function(d){
  if(!d||!d.user)return;
  var u=d.user;
  document.getElementById('who').textContent='Signed in as '+(u.name||u.username);
  if(u.is_admin){var t=document.getElementById('admin-tile');if(t)t.style.display='flex'}
}).catch(function(){});
fetch('/api/health').then(function(r){return r.ok?r.json():null}).then(function(d){if(d&&d.build)document.getElementById('build').textContent='Omniilink · '+d.build}).catch(function(){});
</script>
</body>
</html>
