# Tunnel config for the docker-compose setup. Uses the SAME named tunnel
# as the native run (no Cloudflare dashboard / Zero Trust token needed).
# The credentials JSON stays on YOUR machine, mounted read-only below.
# Adjust tunnel name / hostname if yours differ (see run-server.py).
tunnel: omniilink
credentials-file: /etc/cloudflared-creds/7f35f941-d7fd-41c6-99a7-b4679e4bb77d.json

ingress:
  # Converter traffic (More → YouTube downloads) goes to a tiny nginx
  # sidecar that strips the /converter prefix cobalt cannot handle itself.
  # NOTE: this must stay a same-hostname path rule — the tunnel's own
  # *.cfargotunnel.com address has no IPv4 record, so phones and IPv4-only
  # networks cannot reach it at all.
  # NOTE: cloudflared matches `path` as a PARTIAL regular expression, so the
  # rule MUST be anchored with ^ — an unanchored /converter/* also matches
  # /api/tools/converter and steals our own config endpoint (404 from nginx).
  - hostname: omniilink.dpdns.org
    path: ^/converter(/|$)
    service: http://converter-proxy:80
  - hostname: omniilink.dpdns.org
    service: http://api:8080
  - service: http_status:404
