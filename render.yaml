services:
  - type: web
    name: modellink
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn modellink.api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: TOGETHER_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: LANGUAGE
        value: "English"
    healthCheckPath: /
    autoDeploy: true
